name: Sync Notion to Trips

on:
  schedule:
    - cron: '0 4 * * *'  # 매일 오후 1시 (KST)
    - cron: '0 9 * * *'  # 매일 오후 6시 (KST)
  workflow_dispatch:
  repository_dispatch:
    types: [notion-webhook]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          echo "Installed packages:"
          npm list --depth=0

      - name: Sync from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SYNC_ACTION: ${{ github.event.client_payload.action }}
          SYNC_PAGE_ID: ${{ github.event.client_payload.page_id }}
          TRIGGER_TYPE: ${{ github.event_name }}
        run: node scripts/sync-notion.js

      - name: Check for changes
        id: check_changes
        run: |
          if [ -z "$(git status --porcelain content/trips/ public/notion-images/ public/sitemap.xml)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --porcelain content/trips/ public/notion-images/ public/sitemap.xml
          fi

      - name: Configure Git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "Notion Sync Bot"
          git config --global user.email "notion-sync[bot]@users.noreply.github.com"

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add -A content/trips/
          git add -A public/notion-images/
          git add -A public/sitemap.xml

          git commit -m "Sync trips from Notion"

          git pull --rebase origin main
          git push origin main

      - name: Check for published slug
        if: steps.check_changes.outputs.has_changes == 'true'
        id: check_slug
        run: |
          if [ -f ".published-slug" ]; then
            SLUG=$(cat .published-slug)
            echo "published_slug=$SLUG" >> $GITHUB_OUTPUT
            echo "has_slug=true" >> $GITHUB_OUTPUT
            echo "Published slug: $SLUG"
          else
            echo "has_slug=false" >> $GITHUB_OUTPUT
            echo "No published slug"
          fi

      - name: Wait for Vercel deployment
        if: steps.check_slug.outputs.has_slug == 'true'
        run: |
          echo "Waiting for Vercel deployment (3 min)..."
          sleep 180
          echo "Done waiting"

      - name: Submit to Google Search Console
        if: steps.check_slug.outputs.has_slug == 'true'
        env:
          PUBLISHED_SLUG: ${{ steps.check_slug.outputs.published_slug }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Submitting URL to Google Search Console..."
          node scripts/google-indexing.js

      - name: Report completion
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "Notion sync completed!"
          if [ -f ".published-slug" ]; then
            echo "Published: $(cat .published-slug)"
            echo "Google indexing requested"
          fi

      - name: No changes
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "No new or updated trips found in Notion"
          echo "All published trips are already synced"
